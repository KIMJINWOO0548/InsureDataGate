name: Verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Independent contract and process tests
        run: python -m unittest discover -s tests -v
      - name: Check the published fictional demo
        run: python -m insuredatagate check examples/insurance-demo/manifest.json --json
      - name: Compare the fictional release candidate
        run: python -m insuredatagate compare examples/insurance-demo/manifest.json examples/insurance-demo-v2/manifest.json --json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned build tool
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Build, inspect and install offline into a disposable environment
        run: python scripts/check_distribution.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install only hash-pinned optional visual test dependencies
        run: python -m pip install --require-hashes -r requirements-browser.lock
      - name: Install the disposable CI browser
        run: python -m playwright install --with-deps --no-shell chromium
      - name: Verify six review states at four viewports
        run: python scripts/check_report_browser.py --channel chromium
      - name: Retain rendered evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-review-browser
          path: |
            reports/runs/*-browser-*/evidence.json
            reports/runs/*-browser-*/*.png
          if-no-files-found: error
          retention-days: 14
